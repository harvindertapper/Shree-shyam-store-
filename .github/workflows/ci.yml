name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Check repository whitespace
        run: git diff --check

      - name: Create debug signing key
        shell: bash
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify release configuration
        run: ./gradlew --no-daemon --stacktrace :app:verifyReleaseConfiguration

      - name: Assemble minified release artifact
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check release secrets are external
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|local\.properties$|.*\.keystore$|.*\.jks$)'; then
            echo "Tracked release secret or keystore detected" >&2
            exit 1
          fi

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      # The native Compose screenshot test is intentionally excluded here because
      # it requires a graphics-capable Robolectric environment and can hang on a
      # headless runner. Stable unit/Robolectric tests remain a required CI gate.
      - name: Run stable unit and Robolectric tests
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
          --tests com.sevenzenlabs.zenmart.SecurityUtilsTest
          --tests com.sevenzenlabs.zenmart.CredentialMigrationTest
          --tests com.sevenzenlabs.zenmart.TenantDeviceContextTest
          --tests com.sevenzenlabs.zenmart.TenantDeviceContextMigrationTest
          --tests com.sevenzenlabs.zenmart.TenantAuthorizationTest
          --tests com.sevenzenlabs.zenmart.AppLockPolicyTest
          --tests com.sevenzenlabs.zenmart.AppLockRecoveryPolicyTest
          --tests com.sevenzenlabs.zenmart.OperatorActionPolicyTest
          --tests com.sevenzenlabs.zenmart.AppDropdownMenuTest
          --tests com.sevenzenlabs.zenmart.BusinessRelationshipPolicyTest
          --tests com.sevenzenlabs.zenmart.RestoreSecurityTest
          --tests com.sevenzenlabs.zenmart.AuthenticatedBackupProviderTest
          --tests com.sevenzenlabs.zenmart.RestoreRecoveryEnvelopeTest
          --tests com.sevenzenlabs.zenmart.CheckoutInvariantsTest
          --tests com.sevenzenlabs.zenmart.CommerceValidationTest
          --tests com.sevenzenlabs.zenmart.BillingCartStateTest
          --tests com.sevenzenlabs.zenmart.BillingCheckoutControllerTest
          --tests com.sevenzenlabs.zenmart.MutationStatusTest
          --tests com.sevenzenlabs.zenmart.SettingsValidationTest
          --tests com.sevenzenlabs.zenmart.SettingsLocaleContractTest
          --tests com.sevenzenlabs.zenmart.SettingsDataStoreTest
          --tests com.sevenzenlabs.zenmart.SettingsControlCenterTest
          --tests com.sevenzenlabs.zenmart.InventoryCatalogTest
          --tests com.sevenzenlabs.zenmart.InventoryCatalogRepositoryTest
          --tests com.sevenzenlabs.zenmart.InventoryLocaleContractTest
          --tests com.sevenzenlabs.zenmart.Issue54LocaleContractTest
          --tests com.sevenzenlabs.zenmart.LocalizationSourceContractTest
          --tests com.sevenzenlabs.zenmart.Issue54BilingualSemanticsTest
          --tests com.sevenzenlabs.zenmart.ReportPolicyTest
          --tests com.sevenzenlabs.zenmart.Issue55ReportLocaleContractTest
          --tests com.sevenzenlabs.zenmart.Issue55ReportSemanticsTest
          --tests com.sevenzenlabs.zenmart.Issue56JourneyCoverageContractTest
          --tests com.sevenzenlabs.zenmart.Issue56JourneySemanticsTest
          --tests com.sevenzenlabs.zenmart.InventoryCatalogMigrationTest
          --tests com.sevenzenlabs.zenmart.PaymentStateMigrationTest
          --tests com.sevenzenlabs.zenmart.StableSyncMigrationTest
          --tests com.sevenzenlabs.zenmart.SyncOutboxTest
          --tests com.sevenzenlabs.zenmart.SyncConflictPolicyTest
          --tests com.sevenzenlabs.zenmart.SyncPullCoordinatorTest
          --tests com.sevenzenlabs.zenmart.SyncContractTest
          --tests com.sevenzenlabs.zenmart.OperationsReadinessTest
          --tests com.sevenzenlabs.zenmart.BuildConfigurationTest
          --tests com.sevenzenlabs.zenmart.StagingEvidenceTest
          --tests com.sevenzenlabs.zenmart.SyncObservabilityTest
          --tests com.sevenzenlabs.zenmart.AutomaticSyncPolicyTest
          --tests com.sevenzenlabs.zenmart.ExampleUnitTest
          --tests com.sevenzenlabs.zenmart.ExampleRobolectricTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shree-shyam-store-unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Verify Room schema artifacts
        shell: bash
        run: |
          set -euo pipefail
          schema_path="app/schemas/com.sevenzenlabs.zenmart.data.AppDatabase/11.json"
          test -f "$schema_path"

          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base_ref="origin/$GITHUB_BASE_REF"
            changed_files="$(git diff --name-only "$base_ref" HEAD)"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files=""
          fi
          if grep -Eq '^app/src/main/java/com/sevenzenlabs/zenmart/data/(AppDatabase|Entities|Daos).*\\.kt$' <<<"$changed_files"; then
            grep -Eq '^app/schemas/.*\\.json$' <<<"$changed_files"
          fi

      - name: Upload Room schema artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shree-shyam-store-room-schemas
          path: app/schemas
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shree-shyam-store-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload minified release outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shree-shyam-store-release-outputs
          path: app/build/outputs/apk/release
          if-no-files-found: warn

  device-smoke:
    name: Issue #56 device journey smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Create debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Issue #56 emulator smoke coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
