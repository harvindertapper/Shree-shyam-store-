name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Check repository whitespace
        run: git diff --check

      - name: Create debug signing key
        shell: bash
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      # The native Compose screenshot test is intentionally excluded here because
      # it requires a graphics-capable Robolectric environment and can hang on a
      # headless runner. Stable unit/Robolectric tests remain a required CI gate.
      - name: Run stable unit and Robolectric tests
        run: >-
          ./gradlew --no-daemon --stacktrace testDebugUnitTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.SecurityUtilsTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.CredentialMigrationTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.AppLockPolicyTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.RestoreSecurityTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.CheckoutInvariantsTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.CommerceValidationTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.BillingCartStateTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.InventoryCatalogTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.InventoryCatalogMigrationTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.PaymentStateMigrationTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.StableSyncMigrationTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.SyncOutboxTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.ExampleUnitTest
          --tests com.aistudio.shreeshyamstore.pqwzkb.ExampleRobolectricTest

      - name: Verify Room schema artifacts
        shell: bash
        run: |
          set -euo pipefail
          schema_path="app/schemas/com.aistudio.shreeshyamstore.pqwzkb.data.AppDatabase/8.json"
          test -f "$schema_path"

          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base_ref="origin/$GITHUB_BASE_REF"
          else
            base_ref="HEAD^"
          fi

          changed_files="$(git diff --name-only "$base_ref...HEAD")"
          if grep -Eq '^app/src/main/java/com/aistudio/shreeshyamstore/pqwzkb/data/(AppDatabase|Entities|Daos).*\\.kt$' <<<"$changed_files"; then
            grep -Eq '^app/schemas/.*\\.json$' <<<"$changed_files"
          fi

      - name: Upload Room schema artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shree-shyam-store-room-schemas
          path: app/schemas
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shree-shyam-store-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
