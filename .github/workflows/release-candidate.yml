name: Signed release candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Positive Android versionCode
        required: true
        default: "1"
        type: string
      version_name:
        description: Android versionName, for example 1.0.0-rc1
        required: true
        default: 1.0.0-rc1
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Build signed release candidate
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Materialize release keystore outside the workspace
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          release_dir="$RUNNER_TEMP/shree-shyam-release"
          mkdir -p "$release_dir"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$release_dir/release.keystore"
          test -s "$release_dir/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$release_dir/release.keystore" >> "$GITHUB_ENV"

      - name: Verify signing inputs are present
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Build and verify signed release candidate
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:verifyReleaseConfiguration
          :app:bundleRelease
          -PAPP_VERSION_CODE=${{ inputs.version_code }}
          -PAPP_VERSION_NAME=${{ inputs.version_name }}
          -PREQUIRE_RELEASE_SIGNING=true

      - name: Verify release outputs and write provenance
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          test -s "$aab"
          test -s "$mapping"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'versionCode=%s\n' "$VERSION_CODE"
            printf 'versionName=%s\n' "$VERSION_NAME"
            printf 'artifact=app-release.aab\n'
            printf 'signing=protected GitHub environment\n'
          } > app/build/outputs/release-provenance.txt
          sha256sum "$aab" "$mapping" app/build/outputs/release-provenance.txt \
            > app/build/outputs/release-checksums.txt

      - name: Upload signed release evidence
        uses: actions/upload-artifact@v7
        with:
          name: shree-shyam-store-signed-release-${{ inputs.version_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/release-provenance.txt
            app/build/outputs/release-checksums.txt
          if-no-files-found: error
